<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Isaac for Healthcare session</title></head>
<body><main><h1>Isaac for Healthcare session</h1><p>Research simulation. Keyboard and pointer input control this isolated virtual environment.</p><form id="attach-form" hidden><label>Session ID <input name="session" required autocomplete="off"></label><label>Handoff ID (from MCP, if supplied) <input name="handoff" autocomplete="off"></label><label>Your Scientific AI API key <input name="key" type="password" required autocomplete="off"></label><button type="submit">Attach to existing session</button><p>The key stays in this page's memory and is sent only to this HTTPS origin. Attachment does not create a new GPU session.</p></form><p id="status" role="status">Waiting for an authenticated session.</p><video id="remote-video" autoplay playsinline tabindex="0" style="width:100%;max-height:80vh;background:#111"></video><audio id="remote-audio" autoplay></audio><button id="disconnect" type="button">Disconnect viewer</button></main><script type="module" src="/src/main.ts"></script></body></html>
