[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-healthcare-runtime"
version = "0.1.0"
description = "Finite, recorded Isaac for Healthcare workflow execution"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.26,<5", "h5py>=3.10", "numpy>=2,<3", "Pillow>=10"]

[project.scripts]
isaac-healthcare = "isaac_healthcare_runtime.runtime:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isaac_healthcare_runtime = ["parameters.schema.json", "scenarios.schema.json"]
