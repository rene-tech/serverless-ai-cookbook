name: Scientific UI theme

on:
  push:
    branches: [main]
    paths:
      - 'templates/hcls-librechat/**'
      - 'life-science/bionemo-librechat/Dockerfile.base'
      - '.github/workflows/scientific-ui-theme.yml'
  pull_request:
    paths:
      - 'templates/hcls-librechat/**'
      - 'life-science/bionemo-librechat/Dockerfile.base'
      - '.github/workflows/scientific-ui-theme.yml'

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/hcls-librechat/theme-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: templates/hcls-librechat/theme-tests/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  scientific-apps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest==9.2.0 mcp==2.2.0 httpx2==2.12.0 httpx==0.28.1 jsonschema==4.26.0 numpy==2.2.6 nibabel==5.4.2 Pillow==12.3.0 h5py==3.13.0
      - run: python -m pytest -q templates/hcls-librechat/test_scientific_app.py templates/hcls-librechat/test_batch_source_preflight.py
