name: Scientific UI theme

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contrast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: templates/hcls-librechat/theme-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: templates/hcls-librechat/theme-tests/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test

  service:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test templates/hcls-librechat/demos/service.test.cjs templates/hcls-librechat/test-scientific-verified-delivery.cjs

  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==9.2.0 mcp==2.2.0 httpx2==2.12.0 jsonschema==4.26.0 numpy==2.5.1 h5py==3.16.0 Pillow==12.2.0
      - run: python -m pytest -p no:cacheprovider -q templates/job-isaac-healthcare/tests/test_runtime.py
        env:
          PYTHONPATH: templates/job-isaac-healthcare/src
      - run: |
          python -m pytest -p no:cacheprovider -q \
            templates/hcls-librechat/test_study_admission_recovery.py \
            templates/hcls-librechat/test_study_observation_recovery.py \
            templates/hcls-librechat/test_study_submission_replay.py \
            templates/hcls-librechat/test_study_cancellation_contract.py \
            templates/hcls-librechat/test_operation_polling.py \
            templates/hcls-librechat/test_result_recovery.py \
            templates/hcls-librechat/test_scientific_verified_results.py \
            templates/hcls-librechat/test_workflow_public_identity.py \
            templates/hcls-librechat/test_batch_source_preflight.py \
            templates/hcls-librechat/test_batch_parameter_preflight.py
